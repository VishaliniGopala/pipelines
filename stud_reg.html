<!DOCTYPE html>
<html>
<head>
<title>Registration Form</title>
<style>
body
{
font-family: Arial,sans-serif;
background-color:#f2f2f2;
display:flex;
justify-content:center;
align-items:center;
}
.container
{
background:white;
padding:25px;
border-radius:10px;
box-shadow: 0 0 10px rgba(0,0,0,0.2);
width:400px;
}
h2
{
text-align:center;
color:#333;
}
h4
{
text-align:center;
color:#333;
}
label
{
font-weight:bold;
}
input
{
width:100%;
padding:10px;
margin:8px 0 15px;
border:1px solid #ccc;
border-radius:5px;
box-sizing:border-box;
}
button
{
width:100%;
padding:10px;
background-color:#28a745;
color:white;
border:none;
border-radius:5px;
font-size:16px;
}
button:hover
{
background-color:#218838;
}
#message
{
margin-top:15px;
text-align:center;
color:green;
font-weight:bold;
display:none;
}
</style>
</head>
<body>
<div class="container">
<h2>MGIT STUDENT REGISTRATION FORM</h2>
<h4> Register Now!</h4>
<form id="registrationForm">
<label for="firstname">First Name</label>
<input type="text" id="firstname" required><br>
<label for="lastname">Last Name</label>
<input type="text" id="lastname" required><br>
<label for="phone">Phone Number</label>
<input type="tel" id="phone" pattern="[0-9]{10}" placeholder="10-digits number" required><br>
<label for="gmail">Gmail</label>
<input type="email" id="gmail" placeholder="example@gmail.com" required><br>
<label for="rollno">Roll Number</label>
<input type="text" id="rollno" required><br>
<label for="address">Address</label>
<input type="text" id="address" required><br>
<button type="submit">Register</button>
</form>
<div id="message">Thankyou for registering!</div>
</div>
<script>
document.getElementById("registrationForm").addEventListener("submit",function(event){
event.preventDefault();
document.getElementByID("message").style.display="block";
});
</script>
</body>
</html>
